name: Build exe

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install PySide6 pyinstaller

      - name: Compiler le .exe
        run: pyinstaller --onefile --noconsole --name Canard canard.py

      - name: Mettre le .exe à disposition
        uses: actions/upload-artifact@v4
        with:
          name: Canard
          path: dist/Canard.exe
